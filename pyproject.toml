[project]
name = "magicretrieval"
version = "0.1.0"
description = "Feature-decomposed retrieval branch — validation gates T0/T1/T2"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow==24.0.0",
    "scipy>=1.17.3",
    "scikit-learn>=1.5.0",
    "tqdm>=4.67.3",
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
