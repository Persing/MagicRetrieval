[project]
name = "magicretrieval"
version = "0.1.0"
description = "Feature-decomposed retrieval branch — validation gates T0/T1/T2"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow==24.0.0",
    "scipy>=1.17.3",
    "scikit-learn>=1.5.0",
    "tqdm>=4.67.3",
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
    "datasets>=2.14.0",
    "accelerate>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `slow` tests really do train a model. They are the only check that the training seed reaches
# the trainer, so they are not optional — they are just kept out of the default fast loop.
# Run them with:  uv run pytest -m slow
markers = ["slow: trains a real model; excluded from the default run"]
addopts = "-m 'not slow'"
